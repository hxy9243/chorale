name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify component usability
        run: npm run test:usability

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify fresh CLI installation and persistence
        run: npm run test:install

  music21-integration:
    name: music21 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned music21
        run: pip install --requirement server/python/requirements-music21.txt

      - name: Install Python sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor policy blocks unprivileged user namespaces on the
          # disposable hosted runner. Permit them here so the real isolation
          # tests can run; production hosts must supply their own sandbox policy.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /usr/bin/true

      - name: Run test suite with music21 required
        env:
          CHORALE_REQUIRE_MUSIC21: "1"
        run: npm test

      - name: Build and package plugins
        run: npm run package

      - name: Verify fresh CLI installation with music21 required
        env:
          CHORALE_REQUIRE_MUSIC21: "1"
        run: npm run test:install

