name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify component usability
        run: npm run test:usability

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify fresh CLI installation and persistence
        run: npm run test:install

  music21-integration:
    name: music21 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned music21
        run: pip install --requirement server/python/requirements-music21.txt

      - name: Run test suite with music21 required
        env:
          CHORALE_REQUIRE_MUSIC21: "1"
        run: npm test

      - name: Build and package plugins
        run: npm run package

      - name: Verify fresh CLI installation with music21 required
        env:
          CHORALE_REQUIRE_MUSIC21: "1"
        run: npm run test:install

