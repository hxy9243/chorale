[project]
name = "chorale-dcml-eval"
version = "0.1.0"
description = "Contamination-aware DCML Mozart harmony-analysis pilot"
requires-python = ">=3.12"
dependencies = [
  "music21==9.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
chorale-dcml-eval = "chorale_dcml_eval.cli:main"
chorale-bachi-eval = "chorale_dcml_eval.bachi_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chorale_dcml_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
